[project]
name = "android-control"
version = "0.1.0"
description = "Let Claude drive a USB-connected Android device: screenshots, pixels, UI tree, input, apps, logcat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pillow>=10",
]

[project.scripts]
android-mcp = "android_control.server:main"
droid = "android_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_control"]
